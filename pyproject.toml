[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepersona"
version = "0.1.0"
description = "Reproducible Steam data auditing for GamePersona"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
web = ["fastapi==0.143.0", "uvicorn==0.54.0", "psycopg[binary]==3.3.6", "python3-openid==3.2.0"]

[project.scripts]
gamepersona = "gamepersona.cli:main"

[tool.setuptools.packages.find]
include = ["gamepersona*"]

[tool.setuptools.package-data]
gamepersona = ["rules/*.json"]
"gamepersona.web" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
